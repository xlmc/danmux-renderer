<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>danmux-renderer · ArtPlayer 接入模板</title>
  <style>
    body { margin: 0; padding: 24px; background: #0f1220; color: #edf0ff; font: 15px/1.5 system-ui, sans-serif; }
    .player-shell { position: relative; max-width: 960px; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; }
  </style>
</head>
<body>
  <h1>ArtPlayer 接入模板</h1>
  <p>需要网络可达 CDN;以所用版本的 ArtPlayer API 为准。核心只有两点:渲染器挂到「视频+弹幕层」的共同父容器上,时间源用播放器内部的 <code>&lt;video&gt;</code>。</p>

  <!-- shell 是渲染器挂载点:ArtPlayer 会把 <video> 渲染进 #artplayer,
       渲染器的 canvas 绝对定位铺满 shell,与视频同一坐标系。 -->
  <div class="player-shell" id="shell">
    <div id="artplayer" style="width:100%;height:100%"></div>
  </div>

  <script src="https://unpkg.com/artplayer@5/dist/artplayer.js"></script>
  <script type="module">
    import { DanmuxCanvasRenderer } from '../src/index.js';

    const shell = document.getElementById('shell');
    const art = new Artplayer({
      container: '#artplayer',
      url: 'https://media.w3.org/2010/05/sintel/trailer.mp4',
      setting: true,
      fullscreen: true, // ArtPlayer 的全屏作用于其容器;弹幕层在 shell 上,如被盖住可改为 shell 全屏
    });

    const video = shell.querySelector('video');
    const renderer = new DanmuxCanvasRenderer({ container: shell, video, zIndex: 5 });

    // 数据入口与原生示例完全一致:唯一来源是 Danmu API 的 /api/v2/comment。
    const API_BASE = 'http://127.0.0.1:9321/87654321';
    const SOURCE_URL = 'https://www.bilibili.com/video/BV1GJ411x7h7';
    fetch(`${API_BASE}/api/v2/comment?url=${encodeURIComponent(SOURCE_URL)}&format=danmux`)
      .then((response) => response.json())
      .then((payload) => renderer.load(payload))
      .catch((error) => console.error('Danmu API 获取失败:', error));
  </script>
</body>
</html>
